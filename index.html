<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Garuda — 90-Day Build</title>
<meta name="theme-color" content="#13283B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Garuda">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1EE; --surface:#FFFFFF; --ink:#13283B; --muted:#5B6B78; --line:#D3DBD7;
  --gold:#A86E06; --gold-soft:#F3E2BC; --teal:#1E6B66; --teal-mid:#7DB8B1; --teal-soft:#D5E9E6; --miss:#AE3D35; --miss-soft:#F4DAD6;
  --font:"Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0E1A25; --surface:#152634; --ink:#E6ECEF; --muted:#93A4B0; --line:#273B4C;
    --gold:#E2A93B; --gold-soft:#3B2F16; --teal:#62B6AC; --teal-mid:#2F6F69; --teal-soft:#16393A; --miss:#E5837A; --miss-soft:#3C2224;
    color-scheme: dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
:root{padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-bottom:calc(80px + env(safe-area-inset-bottom,0px))}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
.wrap{max-width:680px;margin:0 auto;padding:0 18px}
.muted{color:var(--muted)}
.small{font-size:.85rem}

/* Header */
header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 0 6px}
.brand{font-weight:800;font-stretch:125%;letter-spacing:.02em;font-size:1.05rem;margin:0}
.dayline{margin:2px 0 0;color:var(--muted);font-size:.92rem}
.hdr-right{display:flex;align-items:center;gap:8px}
.sync{font-size:.78rem;color:var(--muted);white-space:nowrap}
.icon-btn{background:none;border:1px solid var(--line);border-radius:10px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer}
.icon-btn svg{width:20px;height:20px}

/* Hero */
.flight{padding:12px 0 20px;border-bottom:1px solid var(--line)}
.flight-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.daynum{font-size:clamp(2.8rem,13vw,4.4rem);font-weight:800;font-stretch:62%;line-height:.9}
.daynum small{display:block;font-size:.95rem;font-stretch:100%;font-weight:600;color:var(--muted);margin-top:6px;line-height:1.2}
.flight-meta{text-align:right;font-size:.9rem;color:var(--muted)}
.flight-meta strong{display:block;color:var(--ink);font-size:1.4rem;font-stretch:75%;font-weight:800}
.track{position:relative;height:56px;margin-top:16px}
.rail{position:absolute;left:0;right:0;top:26px;height:4px;background:var(--line);border-radius:2px}
.band{position:absolute;top:20px;height:16px;background:var(--gold-soft);border-radius:4px}
.tick{position:absolute;top:40px;transform:translateX(-50%);font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tick::before{content:"";position:absolute;left:50%;top:-12px;width:1px;height:8px;background:var(--muted);opacity:.5}
.marker{position:absolute;top:0;transform:translateX(-50%);transition:left .6s cubic-bezier(.2,.8,.2,1)}
.marker svg{width:30px;height:30px;display:block;color:var(--gold)}
.flight-note{font-size:.85rem;color:var(--muted);margin:6px 0 0}

/* Layout */
main{padding-top:18px}
.view{display:none}.view.on{display:block}
h2{font-size:1.35rem;font-weight:750;font-stretch:88%;margin:6px 0 14px}
h3{font-size:1.02rem;font-weight:750;margin:26px 0 10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.datebar{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.datebar input{flex:1;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}

/* Checklist strip */
.checklist{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;margin-bottom:6px}
.scorebig{font-size:2.6rem;font-weight:800;font-stretch:62%;line-height:1}
.scorebig small{font-size:.45em;color:var(--muted);font-stretch:100%}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:.78rem;font-weight:600;padding:4px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.pill.hit{background:var(--teal-soft);border-color:transparent;color:var(--teal)}

/* Fields */
.fields{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.field{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px 8px;min-width:0}
.field.wide{grid-column:1/-1}
.field label{display:block;font-size:.82rem;color:var(--muted);font-weight:600}
.field input,.field textarea{width:100%;border:0;background:transparent;padding:2px 0;outline:none}
.field input[type=number]{font-size:1.5rem;font-weight:750;font-stretch:75%;font-variant-numeric:tabular-nums}
.field textarea{min-height:56px;resize:vertical}
.field .hint{font-size:.78rem;color:var(--muted)}
.field[data-state=good]{border-color:var(--teal)} .field[data-state=good] .hint{color:var(--teal)}
.field[data-state=low]{border-color:var(--miss)} .field[data-state=low] .hint{color:var(--miss)}
.field[data-state=high] .hint{color:var(--gold)}
input[type=date],input.plain,select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-height:42px}

/* Chips */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:.88rem;font-weight:600;cursor:pointer;min-height:38px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed=true][data-v=skip],.chip[aria-pressed=true][data-v=missed]{background:var(--miss);border-color:var(--miss);color:#fff}
.chip-label{font-size:.82rem;color:var(--muted);font-weight:600;margin:0 0 6px}

/* Meals */
.meals{display:grid;gap:10px}
.meal{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.meal-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.meal-name{font-weight:750}
.meal-name em{font-style:normal;font-size:.75rem;font-weight:700;color:var(--miss);margin-left:6px}
.meal-est{font-size:.8rem;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.meal-items{font-size:.88rem;color:var(--muted);margin:2px 0 10px}
.meal[data-s=skip]{border-color:var(--miss)}
.extras{display:grid;gap:6px}
.extra{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.extra:last-child{border-bottom:0}
.extra span small{color:var(--muted)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-weight:700}
.stepper output{min-width:20px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.custom{display:grid;grid-template-columns:1fr 70px 60px auto;gap:6px;margin-top:8px}
.custom input{min-width:0;width:100%}
.totals{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:12px 14px;border-radius:14px;background:var(--teal-soft);margin-top:10px}
.totals b{font-size:1.35rem;font-stretch:75%}
details.card summary{cursor:pointer;font-weight:700}
details.card[open] summary{margin-bottom:10px}

.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:700;cursor:pointer;background:var(--ink);color:var(--bg);min-height:48px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:8px 12px;min-height:40px;font-size:.9rem}
.btn:disabled{opacity:.5;cursor:wait}
.savebar{position:sticky;bottom:calc(72px + env(safe-area-inset-bottom,0px));padding:10px 0;background:linear-gradient(transparent,var(--bg) 30%);margin-top:16px;z-index:5}
.savebar .btn{width:100%}

/* Diet plan */
.timeline{list-style:none;margin:0;padding:0;position:relative}
.timeline::before{content:"";position:absolute;left:75px;top:6px;bottom:6px;width:2px;background:var(--line)}
.timeline > li{display:grid;grid-template-columns:64px 1fr;gap:30px;padding:8px 0;position:relative}
.timeline time{font-variant-numeric:tabular-nums;font-weight:700;font-size:.9rem;text-align:right;white-space:nowrap}
.timeline time small{font-weight:500;color:var(--muted);margin-left:2px}
.timeline > li::after{content:"";position:absolute;left:71px;top:14px;width:10px;height:10px;border-radius:50%;background:var(--bg);border:2px solid var(--muted)}
.timeline > li.past{color:var(--muted)} .timeline > li.past::after{background:var(--muted)}
.timeline > li.now::after{background:var(--gold);border-color:var(--gold);box-shadow:0 0 0 5px var(--gold-soft)}
.timeline > li.now .t-title{color:var(--gold)}
.t-title{font-weight:700;display:block}
.t-body{font-size:.92rem;display:block}
.t-body ul{margin:4px 0 0;padding-left:18px}
.t-kcal{font-size:.8rem;color:var(--muted)}
.tag{display:inline-block;font-size:.8rem;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--gold-soft);color:var(--gold);margin-bottom:12px}
.note{background:var(--teal-soft);border-radius:12px;padding:12px 14px;font-size:.92rem;margin:14px 0}
.targets{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 16px;font-size:.92rem;margin:0}
.targets dt{color:var(--muted)} .targets dd{margin:0 0 6px;font-weight:650}
.prose{font-size:.93rem} .prose li{margin-bottom:4px} .prose ul{padding-left:20px;margin:6px 0}

/* Train */
.phase-box{border-left:4px solid var(--gold);background:var(--surface);border-radius:0 12px 12px 0;padding:10px 14px;margin-bottom:16px;font-size:.92rem}
.phase-box ul{margin:6px 0 0;padding-left:18px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.ex-head{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ex-name{font-weight:750}
.ex-target{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.ex-cue{font-size:.82rem;color:var(--muted);margin:2px 0 6px}
.ex-last{font-size:.8rem;color:var(--teal);margin:0 0 6px}
.ready{display:inline-block;font-size:.78rem;font-weight:700;background:var(--gold-soft);color:var(--gold);border-radius:999px;padding:2px 9px;margin-bottom:6px}
.setrow{display:grid;grid-template-columns:44px 1fr 1fr 28px;gap:8px;align-items:center;margin-top:6px}
.setrow .sn{font-size:.82rem;color:var(--muted);font-weight:600}
.setrow input{width:100%;min-width:0}
.setrow .ok{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:800;color:transparent;border:2px solid var(--line)}
.setrow.met .ok{background:var(--teal);border-color:var(--teal);color:#fff}
.setrow.short .ok{border-color:var(--miss);color:var(--miss)}
.timerow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px}
.tick-btn{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:.92rem}
.tick-btn input{width:22px;height:22px;accent-color:var(--teal)}

/* Progress */
.grid90{display:grid;grid-template-columns:28px repeat(7,1fr);gap:4px;font-size:.72rem}
.grid90 .gh{color:var(--muted);text-align:center;font-weight:600}
.grid90 .wk{color:var(--muted);font-weight:600;align-self:center;font-variant-numeric:tabular-nums}
.cell{aspect-ratio:1;border-radius:6px;border:1px dashed var(--line);background:transparent;cursor:pointer;padding:0;display:grid;place-items:center;font-size:.68rem;color:var(--muted);font-variant-numeric:tabular-nums}
.cell.miss{border:1px solid var(--miss);background:var(--miss-soft)}
.cell.s1{border:0;background:var(--gold-soft);color:var(--gold)}
.cell.s2{border:0;background:var(--teal-mid);color:#fff}
.cell.s3{border:0;background:var(--teal);color:#fff}
.cell.today{outline:2px solid var(--gold);outline-offset:1px}
.cell.b21{box-shadow:inset 0 -3px 0 var(--gold)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:.78rem;color:var(--muted);margin-top:8px;align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.stat b{display:block;font-size:1.4rem;font-stretch:75%;font-weight:800}
.stat span{font-size:.78rem;color:var(--muted)}
.chart-wrap{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 8px 4px;overflow-x:auto}
.chart-wrap svg{width:100%;height:auto;display:block;min-width:300px}
.verdict{border-left:4px solid var(--gold);padding:10px 14px;background:var(--surface);border-radius:0 12px 12px 0;margin:16px 0}
.verdict strong{display:block}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.88rem;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600}
.up{color:var(--teal)} .down{color:var(--miss)} .goldtxt{color:var(--gold);font-weight:700}
.empty{padding:22px 6px;text-align:center;color:var(--muted)}

/* Tabs, dialog, toast */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{background:none;border:0;padding:10px 4px 12px;cursor:pointer;color:var(--muted);font-weight:600;font-size:.85rem;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs svg{width:22px;height:22px}
nav.tabs button[aria-current=page]{color:var(--ink)}
nav.tabs button[aria-current=page] svg{color:var(--gold)}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);padding:20px;width:min(460px,calc(100% - 32px))}
dialog::backdrop{background:rgba(10,20,30,.45)}
dialog label{display:block;font-size:.85rem;font-weight:600;color:var(--muted);margin:12px 0 4px}
dialog input{width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;transition:all .25s;z-index:30;pointer-events:none;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--miss);color:#fff}
@media (prefers-reduced-motion: reduce){*{transition:none !important}}
@media (max-width:420px){.fields{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr 1fr}.custom{grid-template-columns:1fr 62px 52px auto}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <p class="brand">GARUDA</p>
      <p class="dayline" id="dayline"></p>
    </div>
    <div class="hdr-right">
      <span class="sync" id="sync">Not connected</span>
      <button class="icon-btn" id="openSettings" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </header>

  <section class="flight" aria-label="Plan progress">
    <div class="flight-top">
      <div class="daynum" id="dayNum">—</div>
      <div class="flight-meta" id="flightMeta"></div>
    </div>
    <div class="track" id="track" aria-hidden="true"></div>
    <p class="flight-note" id="flightNote"></p>
  </section>

  <main>
    <!-- LOG -->
    <section class="view on" id="view-today">
      <div class="datebar">
        <button class="btn ghost small" data-shift="-1" aria-label="Previous day">Prev</button>
        <input type="date" id="dateInput" aria-label="Log date">
        <button class="btn ghost small" data-shift="1" aria-label="Next day">Next</button>
      </div>
      <div class="checklist card">
        <div class="scorebig" id="scoreBig">0<small>/8</small></div>
        <div class="pills" id="pills"></div>
      </div>
      <div id="logBody"></div>
      <div class="savebar"><button class="btn" id="saveDaily">Save day</button></div>
    </section>

    <!-- DIET -->
    <section class="view" id="view-plan">
      <div id="planBody"></div>
    </section>

    <!-- TRAIN -->
    <section class="view" id="view-train">
      <div class="datebar">
        <button class="btn ghost small" data-shift="-1" aria-label="Previous day">Prev</button>
        <input type="date" id="dateInput2" aria-label="Workout date">
        <button class="btn ghost small" data-shift="1" aria-label="Next day">Next</button>
      </div>
      <div id="trainBody"></div>
      <div class="savebar"><button class="btn" id="saveWorkout">Save workout</button></div>
    </section>

    <!-- PROGRESS -->
    <section class="view" id="view-progress">
      <div id="progressBody"></div>
    </section>
  </main>
</div>

<nav class="tabs" aria-label="Sections">
  <div class="in">
    <button data-tab="today" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>Log</button>
    <button data-tab="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 11h16a8 8 0 0 1-16 0z"/><path d="M8 7c0-1.5 1-2 1-3M12 7c0-1.5 1-2 1-3M16 7c0-1.5 1-2 1-3"/></svg>Diet</button>
    <button data-tab="train"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>Train</button>
    <button data-tab="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>Progress</button>
  </div>
</nav>

<dialog id="settings">
  <h2 style="margin-top:0">Settings</h2>
  <p class="muted small" style="margin:0">The URL and PIN stay on this device only.</p>
  <label for="s-url">Web App URL (ends in /exec)</label>
  <input class="plain" id="s-url" type="url" placeholder="https://script.google.com/macros/s/…/exec">
  <label for="s-pin">PIN</label>
  <input class="plain" id="s-pin" type="password" inputmode="numeric" autocomplete="off">
  <label for="s-start">Day 1 of the 90-day plan</label>
  <input class="plain" id="s-start" type="date">
  <div class="two">
    <div><label for="s-sw">Starting weight (kg)</label><input class="plain" id="s-sw" type="number" step="0.1" inputmode="decimal"></div>
    <div><label for="s-gw">Goal weight (kg)</label><input class="plain" id="s-gw" type="number" step="0.1" inputmode="decimal"></div>
  </div>
  <div class="row" style="margin-top:18px;justify-content:flex-end">
    <button class="btn ghost small" id="testConn">Test connection</button>
    <button class="btn ghost small" id="closeSettings">Cancel</button>

/* ===================== State & storage ===================== */

};
const oldS = store.get('garuda.settings.v1', {});

/* ===================== Helpers ===================== */
function todayISO(){ const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10); }
function addDays(iso, n){ const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0,10); }
function daysBetween(a, b){ return Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 864e5); }
function dow(iso){ return new Date(iso + 'T00:00:00Z').getUTCDay(); }
function dayNo(iso){ return daysBetween(S.startDate, iso) + 1; }
function weekNo(iso){ return Math.floor((dayNo(iso) - 1) / 7) + 1; }
function fmtDate(iso, opt){ return new Date(iso + 'T00:00:00Z').toLocaleDateString('en-IN', Object.assign({ timeZone:'UTC' }, opt || { weekday:'long', day:'numeric', month:'short' })); }
function shortDate(iso){ return fmtDate(iso, { day:'numeric', month:'short' }); }
function clock(t){ const h = +t.slice(0,2); return (h > 12 ? h - 12 : h) + ':' + t.slice(3) + '<small>' + (h >= 12 ? 'pm' : 'am') + '</small>'; }
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => (v === '' || v === null || v === undefined || isNaN(Number(v))) ? null : Number(v);
const mean = a => a.length ? a.reduce((x,y)=>x+y,0) / a.length : null;
const fmt = (v, d=1) => v === null || v === undefined ? '—' : Number(v).toFixed(d);
const int = v => v === null || v === undefined ? '—' : Math.round(v).toLocaleString('en-IN');
const truthy = v => v === true || v === 'TRUE' || v === 'true';
const phaseFor = d => PHASES.find(p => d >= p.from && d <= p.to) || null;
const isEggDay = iso => !NO_EGG_DAYS.includes(dow(iso));

const parseExtras = v => { try { const o = typeof v === 'string' && v ? JSON.parse(v) : (v && typeof v === 'object' ? v : {}); o.custom = o.custom || []; return o; } catch(e){ return { custom:[] }; } };
let toastTimer;
function toast(msg, err){ const t = $('#toast'); t.textContent = msg; t.className = 'toast show' + (err ? ' err' : ''); clearTimeout(toastTimer); toastTimer = setTimeout(()=> t.className = 'toast', 2800); }

/* ===================== API (saves go as GET; POST only for very long payloads) ===================== */
async function call(action, payload){
  if (!S.apiUrl) throw new Error('Add your Web App URL in Settings');
  const u = new URL(S.apiUrl);
  u.searchParams.set('action', action); u.searchParams.set('token', S.pin);
  if (payload) u.searchParams.set('payload', JSON.stringify(payload));
  let r;
  if (u.toString().length < 7500) r = await fetch(u.toString(), { redirect:'follow' });
  else r = await fetch(S.apiUrl, { method:'POST', redirect:'follow', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action, token:S.pin }, payload)) });
  const j = await r.json(); if (!j.ok) throw new Error(j.error || 'Request failed'); return j;
}
async function sync(){
  if (!S.apiUrl) { $('#sync').textContent = 'Not connected'; return; }
  $('#sync').textContent = 'Syncing…';
  try {
    const j = await call('data');
    DB = { daily: j.daily || [], sets: j.sets || [], syncedAt: new Date().toISOString() };
    store.set(LS_CACHE, DB); renderAll();
  } catch (e) { $('#sync').textContent = 'Offline copy'; toast(e.message, true); }
}

/* ===================== Calculations ===================== */
const dailyRows = () => DB.daily.filter(r => r.date).slice().sort((a,b) => a.date < b.date ? -1 : 1);
const rowFor = iso => DB.daily.find(r => r.date === iso);
const setsFor = iso => DB.sets.filter(s => s.date === iso);
function rollingAvg(rows, iso){
  const from = addDays(iso, -6);
  const w = rows.filter(r => r.date >= from && r.date <= iso && num(r.weight) !== null).map(r => num(r.weight));
  return w.length ? mean(w) : null;
}
function expected(d){ const wk = Math.max(0, d - 1) / 7; return [S.startWeight + 0.15*wk, S.startWeight + 0.30*wk]; }
function autoTotals(r, iso){
  const menu = menuFor(iso); let k = 0, p = 0;
  MEALS.forEach(m => { const st = MEAL_STATES.find(s => s[0] === r['m_' + m.key]); if (st) { k += menu[m.key].kcal * st[2]; p += menu[m.key].p * st[2]; } });
  const ex = parseExtras(r.extras);
  EXTRAS.forEach(e => { const n = num(ex[e.key]) || 0; k += n * e.kcal; p += n * e.p; });
  ex.custom.forEach(c => { k += num(c.k) || 0; p += num(c.p) || 0; });
  return { kcal: Math.round(k), p: Math.round(p) };
}
const finalKcal = r => num(r.kcalActual) ?? num(r.calories) ?? num(r.kcalAuto);
const finalProt = r => num(r.proteinActual) ?? num(r.protein) ?? num(r.proteinAuto);
function scoreOf(r, iso){
  if (!r) return { hits: CHECK_LABELS.map(()=>false), n:0 };
  const rec = SPLIT[dow(iso)].recovery;
  const nSets = setsFor(iso).filter(s => num(s.reps) !== null || truthy(s.done)).length;
  const hits = [
    num(r.weight) !== null,
    r.workout === 'done' || r.workout === 'recovery',
    (finalProt(r) || 0) >= TARGET.protein,
    (finalKcal(r) || 0) >= TARGET.kcalLo,
    (num(r.water) || 0) >= TARGET.water,
    !!r.m_lunch && r.m_lunch !== 'skip',
    (num(r.sleep) || 0) >= TARGET.sleep,
    nSets > 0 || (rec && r.workout === 'recovery')
  ];
  return { hits, n: hits.filter(Boolean).length };
}

function renderHeader(){

}
function renderHero(){
  const t = todayISO(), d = dayNo(t), ph = phaseFor(d), rows = dailyRows();
  if (d < 1) { const n = 1 - d; $('#dayNum').innerHTML = 'Day 0<small>starts ' + (n === 1 ? 'tomorrow' : 'in ' + n + ' days') + '</small>'; }
  else if (d > S.days) $('#dayNum').innerHTML = 'Day ' + d + '<small>plan complete</small>';
  else $('#dayNum').innerHTML = 'Day ' + d + '<small>of ' + S.days + (d <= 21 ? ', first 21' : '') + '</small>';
  const withW = rows.filter(r => num(r.weight) !== null);
  const avg = withW.length ? rollingAvg(rows, withW[withW.length-1].date) : null;
  $('#flightMeta').innerHTML = '<strong>' + (avg === null ? '— kg' : avg.toFixed(1) + ' kg') + '</strong>7-day average';
  const lo = Math.floor(Math.min(S.startWeight, avg ?? S.startWeight)), hi = Math.ceil(S.goalWeight);
  const pos = v => Math.max(0, Math.min(100, (v - lo) / (hi - lo) * 100));
  let html = '<div class="rail"></div>';
  const dd = Math.max(1, Math.min(S.days, d)), [elo, ehi] = expected(dd);
  html += '<div class="band" style="left:' + pos(elo) + '%;width:' + Math.max(1.5, pos(ehi) - pos(elo)) + '%"></div>';
  for (let k = lo; k <= hi; k++) html += '<span class="tick" style="left:' + pos(k) + '%">' + k + '</span>';
  if (avg !== null) html += '<div class="marker" style="left:' + pos(avg) + '%"><svg viewBox="0 0 32 32" fill="currentColor"><path d="M16 4c-1.4 2.6-2 4.8-2 7.2-3.6-2.2-7.8-3.4-12-3.2 2.4 3 5.6 5.6 9.4 7.2L7 24l6-2.4L16 28l3-6.4 6 2.4-4.4-8.8c3.8-1.6 7-4.2 9.4-7.2-4.2-.2-8.4 1-12 3.2 0-2.4-.6-4.6-2-7.2z"/></svg></div>';
  $('#track').innerHTML = html;
  $('#flightNote').textContent = (ph ? ph.name + '. ' : '') + 'Shaded: where your average should be today (' + elo.toFixed(1) + '–' + ehi.toFixed(1) + ' kg, +0.15–0.30 kg a week). Goal ' + S.goalWeight + ' kg.';
}

}

}

      '<p class="meal-items">' + esc(mm.items.join(', ')) + '</p>' + chipGroup('m_' + m.key, MEAL_STATES.map(s => [s[0], s[1]])) + '</div>';
  });
  h += '</div>';

  h += '<h3>Extras and outside food</h3><div class="card"><div class="extras" id="extras"></div>' +

/* ===================== TRAIN ===================== */
function sessionsOf(name, before){
  const rows = DB.sets.filter(s => s.exercise === name && s.date < before);
  const byDate = {}; rows.forEach(s => (byDate[s.date] = byDate[s.date] || []).push(s));
  return Object.keys(byDate).sort().reverse().map(d => ({ date:d, sets: byDate[d].sort((a,b) => a.setNo - b.setNo) }));
}
function sessionMet(sess){
  const rs = sess.sets.filter(s => num(s.target) !== null);
  return rs.length > 0 && rs.every(s => (num(s.reps) || 0) >= num(s.target));
}
function progressNote(ex, before){
  const ss = sessionsOf(ex.n, before);
  if (!ss.length) return { last:null, ready:false, load: ex.load ?? 0 };
  const l = ss[0], load = num(l.sets[0].load) ?? ex.load ?? 0;
  const last = 'Last (' + shortDate(l.date) + '): ' + (ex.bw ? 'BW' : load + ' kg') + ' × ' + l.sets.map(s => num(s.reps) ?? '–').join('/');
  const ready = !ex.bw && ss.length >= 2 && sessionMet(ss[0]) && sessionMet(ss[1]) && num(ss[0].sets[0].load) === num(ss[1].sets[0].load);
  return { last, ready, load };
}
function buildWorkout(){
  const iso = state.date, plan = SPLIT[dow(iso)], saved = setsFor(iso);
  T = plan.ex.map(ex => {
    const pn = progressNote(ex, iso);
    const mine = saved.filter(s => s.exercise === ex.n).sort((a,b) => a.setNo - b.setNo);
    if (ex.time) return { ex, pn, sets:[{ done: mine.length ? truthy(mine[0].done) : false }] };
    return { ex, pn, sets: ex.reps.map((t, i) => {
      const m = mine.find(s => +s.setNo === i + 1);
      return { load: m ? (num(m.load) ?? '') : (ex.bw ? '' : pn.load), reps: m ? (num(m.reps) ?? '') : '' };
    })};
  });
}

function renderProgress(){
  const rows = dailyRows(), t = todayISO(), start = S.startDate;
  let h = '<h2>Progress</h2>';

  // 90-day grid
  const heads = []; for (let i = 0; i < 7; i++) heads.push(fmtDate(addDays(start, i), { weekday:'short' }).slice(0,2));
  h += '<div class="card"><div class="grid90"><span></span>' + heads.map(x => '<span class="gh">' + x + '</span>').join('');
  for (let w = 0; w < Math.ceil(S.days / 7); w++) {
    h += '<span class="wk">W' + (w+1) + '</span>';
    for (let i = 0; i < 7; i++) {
      const dn = w*7 + i + 1; if (dn > S.days) { h += '<span></span>'; continue; }
      const iso = addDays(start, dn - 1), r = rowFor(iso), sc = r ? scoreOf(r, iso).n : null;
      let cls = 'cell';
      if (sc !== null) cls += sc >= 7 ? ' s3' : sc >= 5 ? ' s2' : ' s1';
      else if (iso < t) cls += ' miss';
      if (iso === t) cls += ' today';
      if (dn <= 21) cls += ' b21';
      h += '<button class="' + cls + '" data-goto="' + iso + '" aria-label="Day ' + dn + ', ' + shortDate(iso) + (sc !== null ? ', score ' + sc + ' of 8' : ', not logged') + '">' + (sc !== null ? sc : dn) + '</button>';
    }
  }
  h += '</div><div class="legend"><span><i style="background:var(--teal)"></i>7–8</span><span><i style="background:var(--teal-mid)"></i>5–6</span><span><i style="background:var(--gold-soft)"></i>0–4</span><span><i style="background:var(--miss-soft);border:1px solid var(--miss)"></i>Not logged</span><span><i style="box-shadow:inset 0 -3px 0 var(--gold);border:1px dashed var(--line)"></i>First 21 days</span></div></div>';

  // 21-day block
  const first21 = []; for (let i = 0; i < 21; i++) first21.push(addDays(start, i));
  const past21 = first21.filter(d => d <= t), logged21 = past21.filter(d => rowFor(d));
  const sessions21 = past21.filter(d => { const r = rowFor(d); return r && (r.workout === 'done' || r.workout === 'recovery'); }).length;
  const avg21 = mean(logged21.map(d => scoreOf(rowFor(d), d).n));
  const lunch21 = logged21.filter(d => { const r = rowFor(d); return r.m_lunch && r.m_lunch !== 'skip'; }).length;
  h += '<h3>First 21 days</h3><div class="stats">' +
    '<div class="stat"><b>' + logged21.length + '/' + Math.max(past21.length, 0) + '</b><span>Days logged so far</span></div>' +
    '<div class="stat"><b>' + (avg21 === null ? '—' : avg21.toFixed(1)) + '</b><span>Average score /8</span></div>' +
    '<div class="stat"><b>' + sessions21 + '/' + past21.length + '</b><span>Sessions done</span></div></div>' +
    '<p class="muted small" style="margin-top:-4px">Lunch eaten on ' + lunch21 + ' of ' + logged21.length + ' logged days. Aim: every day logged and a 7+ average by day 21.</p>';

  // last 7 days
  const l7 = rows.filter(r => r.date > addDays(t, -7) && r.date <= t);
  let streak = 0, d = rowFor(t) ? t : addDays(t, -1); while (rowFor(d)) { streak++; d = addDays(d, -1); }
  h += '<h3>Last 7 days</h3><div class="stats">' +
    '<div class="stat"><b>' + streak + '</b><span>Day streak</span></div>' +
    '<div class="stat"><b>' + int(mean(l7.map(finalKcal).filter(v => v !== null))) + '</b><span>Avg kcal</span></div>' +
    '<div class="stat"><b>' + int(mean(l7.map(finalProt).filter(v => v !== null))) + ' g</b><span>Avg protein</span></div></div>';

  // weight chart

  const solid = weeks.filter(w => w.weighIns >= 4);

  else {

    const c = solid[solid.length-3], prevRate = c ? b.avgW - c.avgW : null;

    else if (rate > 0.4 && prevRate !== null && prevRate > 0.4) { title = 'Gaining fast (+' + rate.toFixed(2) + ' kg/week)'; body = 'Faster than about 0.3 kg a week for several weeks. If your waist is climbing, trim the surplus slightly.'; }

  const k7 = mean(l7.map(finalKcal).filter(v => v !== null));

  // weekly table

  else {
    let prev = null;
    h += '<div class="table-wrap"><table><thead><tr><th>Week</th><th>Avg kg</th><th>Change</th><th>kcal</th><th>Protein</th><th>Score</th><th>Sessions</th><th>Waist</th></tr></thead><tbody>' +

      }).join('') + '</tbody></table></div>';

  // lifts

    const pn = progressNote(e, '9999-12-31');
    return '<tr><td>' + esc(e.n) + '</td><td>' + show(first) + '</td><td>' + show(latest) + '</td><td>' + (pn.ready ? '<span class="goldtxt">Add load</span>' : 'Hold') + '</td></tr>';
  }).filter(Boolean);
  h += '<h3>Lifts: first vs latest</h3>' + (lift.length ? '<div class="table-wrap"><table><thead><tr><th>Exercise</th><th>First</th><th>Latest</th><th>Next</th></tr></thead><tbody>' + lift.join('') + '</tbody></table></div>' : '<p class="empty">Log a workout in Train and your lifts appear here.</p>');

  $('#progressBody').innerHTML = h;
}
function weekRows(rows){
  const byW = {};
  rows.filter(r => r.date >= S.startDate).forEach(r => { const w = weekNo(r.date); (byW[w] = byW[w] || []).push(r); });
  return Object.keys(byW).map(Number).sort((a,b) => a-b).map(w => {
    const rs = byW[w], ws = rs.map(r => num(r.weight)).filter(v => v !== null), wa = rs.map(r => num(r.waist)).filter(v => v !== null);
    return { week:w, days: rs.length, weighIns: ws.length, avgW: mean(ws),
      kcal: mean(rs.map(finalKcal).filter(v => v !== null)), protein: mean(rs.map(finalProt).filter(v => v !== null)),
      score: mean(rs.map(r => scoreOf(r, r.date).n)), sessions: rs.filter(r => r.workout === 'done' || r.workout === 'recovery').length,
      waist: wa.length ? wa[wa.length-1] : null };
  });
}
function chartSVG(rows){
  const pts = rows.filter(r => num(r.weight) !== null && r.date >= addDays(S.startDate, -7));
  if (pts.length < 2) return '<p class="empty">Log two morning weights to see your trend against the target range.</p>';
  const W = 420, H = 230, L = 32, R = 10, T0 = 12, B = 28;
  const lastDay = Math.min(S.days, Math.max(21, dayNo(pts[pts.length-1].date) + 4));
  const firstDay = Math.min(1, dayNo(pts[0].date));
  const [, hiEnd] = expected(lastDay);
  const vals = pts.map(p => num(p.weight));
  const yMin = Math.floor(Math.min(...vals, S.startWeight) - 0.3), yMax = Math.ceil(Math.max(...vals, hiEnd) + 0.2);
  const x = dn => L + (dn - firstDay) / Math.max(1, lastDay - firstDay) * (W - L - R);
  const y = v => T0 + (1 - (v - yMin) / Math.max(0.5, yMax - yMin)) * (H - T0 - B);
  let g = '';
  for (let k = yMin; k <= yMax; k++) g += '<line x1="' + L + '" x2="' + (W-R) + '" y1="' + y(k) + '" y2="' + y(k) + '" stroke="var(--line)"/><text x="' + (L-6) + '" y="' + (y(k)+4) + '" text-anchor="end" font-size="12" fill="var(--muted)">' + k + '</text>';
  const top = [], bot = []; for (let dn = Math.max(1, firstDay); dn <= lastDay; dn++) { const [lo, hi] = expected(dn); top.push(x(dn).toFixed(1) + ',' + y(hi).toFixed(1)); bot.unshift(x(dn).toFixed(1) + ',' + y(lo).toFixed(1)); }
  const cone = '<polygon points="' + top.concat(bot).join(' ') + '" fill="var(--gold-soft)" opacity=".8"/>';
  const dots = pts.map(p => '<circle cx="' + x(dayNo(p.date)).toFixed(1) + '" cy="' + y(num(p.weight)).toFixed(1) + '" r="3.5" fill="var(--muted)" opacity=".6"><title>' + p.date + ': ' + num(p.weight) + ' kg</title></circle>').join('');
  const path = pts.map((p, i) => (i ? 'L' : 'M') + x(dayNo(p.date)).toFixed(1) + ' ' + y(rollingAvg(rows, p.date)).toFixed(1)).join(' ');
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Weight trend against target range">' + g + cone + dots +
    '<path d="' + path + '" fill="none" stroke="var(--gold)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>' +
    '<text x="' + L + '" y="' + (H-8) + '" font-size="12" fill="var(--muted)">Day ' + firstDay + '</text><text x="' + (W-R) + '" y="' + (H-8) + '" font-size="12" fill="var(--muted)" text-anchor="end">Day ' + lastDay + '</text></svg>' +
    '<p class="muted" style="font-size:.8rem;margin:4px 6px">Dots: weigh-ins. Line: 7-day average. Shaded: target range (+0.15–0.30 kg a week).</p>';
}

/* ===================== Wiring ===================== */
function renderAll(){ renderHeader(); renderHero(); renderLog(); renderPlan(); renderTrain(); renderProgress(); }
function setDate(iso){ state.date = iso; renderLog(); renderPlan(); renderTrain(); }
function setTab(tab){
  state.tab = tab;
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === 'view-' + tab));
  document.querySelectorAll('nav.tabs button').forEach(b => { if (b.dataset.tab === tab) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
  window.scrollTo({ top: 0 });
}
document.querySelectorAll('nav.tabs button').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));
document.querySelectorAll('[data-shift]').forEach(b => b.addEventListener('click', () => setDate(addDays(state.date, +b.dataset.shift))));
$('#dateInput').addEventListener('change', e => e.target.value && setDate(e.target.value));
$('#dateInput2').addEventListener('change', e => e.target.value && setDate(e.target.value));

// Log interactions
$('#logBody').addEventListener('input', e => {
  const k = e.target.dataset.bind; if (k) { F[k] = e.target.value; updateLive(); }
});
$('#logBody').addEventListener('change', e => { if (e.target.id === 'f-photos') F.photos = e.target.checked; });
$('#logBody').addEventListener('click', e => {
  const chip = e.target.closest('[data-chip]');
  if (chip) {
    const k = chip.dataset.chip, v = chip.dataset.v;
    F[k] = String(F[k]) === v ? '' : (k === 'energy' ? +v : v);
    chip.parentElement.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(F[k]) === c.dataset.v));
    updateLive(); return;
  }
  const ex = e.target.closest('[data-ex]');
  if (ex) { const k = ex.dataset.ex; F.extras[k] = Math.max(0, (num(F.extras[k]) || 0) + +ex.dataset.d); if (!F.extras[k]) delete F.extras[k]; renderExtras(); updateLive(); return; }
  const st = e.target.closest('[data-step]');
  if (st) { F.coffee = Math.max(0, Math.min(9, (num(F.coffee) || 0) + +st.dataset.d)); $('#coffeeOut').textContent = F.coffee; if (F.coffee > TARGET.coffee) toast('More than 2 coffees. Don’t let it replace food.'); return; }
  const cd = e.target.closest('[data-cdel]');
  if (cd) { F.extras.custom.splice(+cd.dataset.cdel, 1); renderExtras(); updateLive(); return; }
  if (e.target.id === 'cx-add') {
    const n = $('#cx-n').value.trim(), k = num($('#cx-k').value), p = num($('#cx-p').value) || 0;
    if (!n || k === null) { toast('Add a food name and its calories', true); return; }
    F.extras.custom.push({ n: n.slice(0, 40), k, p }); $('#cx-n').value = $('#cx-k').value = $('#cx-p').value = '';
    renderExtras(); updateLive();
  }
});
$('#saveDaily').addEventListener('click', saveDay);

// Train interactions
$('#trainBody').addEventListener('input', e => {
  const t = e.target; if (t.dataset.ti === undefined || t.type === 'checkbox') return;
  T[+t.dataset.ti].sets[+t.dataset.si][t.dataset.f] = t.value; markSets();
});
$('#trainBody').addEventListener('change', e => {
  const t = e.target; if (t.type === 'checkbox' && t.dataset.ti !== undefined) T[+t.dataset.ti].sets[0].done = t.checked;
  if (t.dataset.f === 'load' && t.dataset.si === '0') { // copy set-1 load to empty later sets
    const it = T[+t.dataset.ti]; it.sets.forEach((s, i) => { if (i > 0) { s.load = t.value; const el = document.querySelector('[data-ti="' + t.dataset.ti + '"][data-si="' + i + '"][data-f="load"]'); if (el) el.value = t.value; } });
  }
});
$('#saveWorkout').addEventListener('click', saveWorkout);

// Progress grid
$('#progressBody').addEventListener('click', e => { const c = e.target.closest('[data-goto]'); if (c) { setDate(c.dataset.goto); setTab('today'); } });

// Settings
const dlg = $('#settings');
function openSettings(){ $('#s-url').value = S.apiUrl; $('#s-pin').value = S.pin; $('#s-start').value = S.startDate; $('#s-sw').value = S.startWeight; $('#s-gw').value = S.goalWeight; dlg.showModal(); }
$('#openSettings').addEventListener('click', openSettings);
$('#closeSettings').addEventListener('click', () => dlg.close());
$('#testConn').addEventListener('click', async () => {
  const keep = Object.assign({}, S); S.apiUrl = $('#s-url').value.trim(); S.pin = $('#s-pin').value.trim();
  try { await call('ping'); toast('Connected to your sheet'); } catch (e) { toast('Connection failed: ' + e.message, true); }
  S = keep;
});
$('#saveSettings').addEventListener('click', () => {
  S.apiUrl = $('#s-url').value.trim(); S.pin = $('#s-pin').value.trim();
  S.startDate = $('#s-start').value || DEFAULTS.startDate;
  S.startWeight = num($('#s-sw').value) ?? DEFAULTS.startWeight; S.goalWeight = num($('#s-gw').value) ?? DEFAULTS.goalWeight;
  store.set(LS_SETTINGS, S); dlg.close(); toast('Settings saved'); renderAll(); sync();
});

let openedOn = todayISO();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (openedOn !== todayISO()) { openedOn = todayISO(); state.date = openedOn; }
  sync();
});

renderAll();
if (!S.apiUrl) openSettings(); else sync();
</script>
</body>
</html>
